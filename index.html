<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Aquastar Ruffle</title>
  <style>
    html,body{margin:0;height:100%;background:#000;overflow:hidden}
    #container{width:100%;height:100%}

    #fps-counter {
      position: absolute;
      top: 5px;
      left: 5px;
      color: white;
      background-color: rgba(0,0,0,0.7);
      padding: 5px 10px;
      font-family: Arial, sans-serif;
      font-size: 14px;
      z-index: 1000;
      border-radius: 3px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="container"></div>
  <div id="fps-counter" style="display:none">FPS: 0</div>

  <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>

  <script>
    const SHOW_FPS = false;

    const PROXY_WS = 'ws://localhost:8181';
    // Live server list from Artix (same API spider.swf uses).
    // Fields: sIP = socket hostname, iPort = TCP port. See README § "Where AQW socket hosts & ports come from".
    const SERVERS_API = 'https://game.aq.com/game/api/data/servers';

    // Used only when SERVERS_API is unreachable — refresh via: curl -sL SERVERS_API | python3 -m json.tool
    const FALLBACK_HOSTS = {
      'sock7.aq.com':        [5588, 5589, 5591, 5592, 5593, 5594, 843],
      'sock8.aq.com':        [5588, 5589, 5590, 5591, 5593, 843],
      'euro.aqw.artix.com':  [5588, 843],
      'asia.game.artix.com': [5588, 843]
    };

    function proxyEntry(host, port) {
      return {
        host,
        port,
        proxyUrl: `${PROXY_WS}?host=${encodeURIComponent(host)}&port=${port}`
      };
    }

    function addHostPort(map, host, port) {
      if (!host || !port) return;
      if (!map.has(host)) map.set(host, new Set());
      map.get(host).add(port);
      map.get(host).add(843);
    }

    function mapToSocketProxies(map) {
      const proxies = [];
      for (const [host, ports] of map) {
        for (const port of ports) proxies.push(proxyEntry(host, port));
      }
      return proxies;
    }

    async function buildSocketProxies() {
      const map = new Map();
      for (const [host, ports] of Object.entries(FALLBACK_HOSTS)) {
        ports.forEach(port => addHostPort(map, host, port));
      }

      try {
        const res = await fetch(SERVERS_API);
        const servers = await res.json();
        for (const s of servers) {
          addHostPort(map, s.sIP, s.iPort);
        }
        console.log(`Loaded ${servers.length} servers from Artix API → ${map.size} socket hosts`);
      } catch (e) {
        console.warn('Artix server API unavailable, using fallback hosts', e);
      }

      return mapToSocketProxies(map);
    }

    function createRufflePlayer() {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.id = 'ruffle';
      document.getElementById('container').appendChild(player);
      return player;
    }

    // Ruffle defaults for everything else (quality, renderer, letterbox, autoplay, …).
    // Only override what this launcher actually needs.
    function buildRuffleConfig(socketProxy) {
      return {
        splashScreen: false,
        preloader: false,
        socketProxy,
        allowFullscreen: true
      };
    }

    const style = document.createElement('style');
    style.textContent = `
      #container, #ruffle {
        width:100vw !important;
        height:100vh !important;
        overflow:hidden !important;
      }
      body { -ms-overflow-style: none; scrollbar-width: none; }
      body::-webkit-scrollbar { display: none; }
    `;
    document.head.appendChild(style);
  </script>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      window.RufflePlayer = window.RufflePlayer || {};

      const [socketProxy, player] = await Promise.all([
        buildSocketProxies(),
        Promise.resolve().then(createRufflePlayer)
      ]);

      const ruffleConfig = buildRuffleConfig(socketProxy);
      window.RufflePlayer.config = ruffleConfig;

      player.load({
        url: 'https://game.aq.com/game/gamefiles/Loader_Spider.swf',
        allowScriptAccess: true,
        allowNetworking: 'all',
        ...ruffleConfig,
        parameters: {
          base: 'https://game.aq.com/game/gamefiles/',
          allowNetworking: 'all'
        }
      }).catch(e => console.error('Player load failed:', e));

      if (SHOW_FPS) {
        const fpsElement = document.getElementById('fps-counter');
        fpsElement.style.display = 'block';
        let frameCount = 0;
        let lastTime = performance.now();

        function updateFPS() {
          frameCount++;
          const currentTime = performance.now();
          if (currentTime - lastTime >= 1000) {
            const fps = Math.round((frameCount * 1000) / (currentTime - lastTime));
            fpsElement.textContent = `FPS: ${fps}`;
            frameCount = 0;
            lastTime = currentTime;
          }
          requestAnimationFrame(updateFPS);
        }

        updateFPS();
      }
    });
  </script>
</body>
</html>
